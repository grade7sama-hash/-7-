<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)" />

  <!-- Content scaled inside 80% circle (center at 256, 256) -->
  <g transform="translate(256, 256) scale(0.75) translate(-256, -256)">
    <!-- Yemeni Flag Ribbon / Shield Header -->
    <g transform="translate(156, 48)">
      <clipPath id="mFlagClip">
        <rect width="200" height="42" rx="21" />
      </clipPath>
      <g clip-path="url(#mFlagClip)">
        <rect x="0" y="0" width="200" height="14" fill="#CE1126" />
        <rect x="0" y="14" width="200" height="14" fill="#FFFFFF" />
        <rect x="0" y="28" width="200" height="14" fill="#000000" />
      </g>
      <rect width="200" height="42" rx="21" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
    </g>

    <!-- Open Book Pages -->
    <g transform="translate(256, 225)">
      <path d="M-110 50 C -70 20, -30 25, 0 45 C 30 25, 70 20, 110 50 L 110 130 C 70 100, 30 105, 0 125 C -30 105, -70 100, -110 130 Z" fill="#ffffff" />
      <path d="M0 45 L 0 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
      <path d="M-5 45 L 5 45 L 5 110 L 0 102 L -5 110 Z" fill="#ef4444" />
      <line x1="-90" y1="65" x2="-20" y2="58" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="-90" y1="85" x2="-20" y2="78" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="58" x2="90" y2="65" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
      <line x1="20" y1="78" x2="90" y2="85" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

      <!-- English 'A' Badge / Emblem -->
      <circle cx="0" cy="-35" r="44" fill="url(#gold)" />
      <text x="0" y="-19" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#1e1b4b" text-anchor="middle">EN</text>
    </g>

    <text x="256" y="385" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#38bdf8" text-anchor="middle">
      GRADE 7 • YEMEN
    </text>
    <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
      تصميم أ. فتحي الواسعي
    </text>
  </g>
</svg>
